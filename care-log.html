<!-- Add Log Form -->
<div class="card">
    <h2 class="card-title">
        <i class="fas fa-plus-circle"></i>
        New Entry
    </h2>
    <form onsubmit="saveCareLog(event)" class="care-log-form">
        <!-- Plants Selection (Multiselect) -->
        <div class="form-group">
            <label class="form-label" for="log-plants">Plants / Herbs *</label>
            <div class="multiselect-container">
                <select id="log-plants" class="form-select" multiple size="4" required>
                    <option value="">Select plants or herbs...</option>
                </select>
                <small class="form-hint">Hold Ctrl/Cmd to select multiple, or tap on mobile</small>
            </div>
        </div>

        <!-- Date Field (Responsive) -->
        <div class="form-group">
            <label class="form-label" for="log-date">Date *</label>
            <input type="date" id="log-date" class="form-input form-input-date" required>
        </div>

        <!-- Activity Type -->
        <div class="form-group">
            <label class="form-label" for="log-type">Activity *</label>
            <select id="log-type" class="form-select form-right-spacer" required onchange="toggleFields()">
                <option value="">Select activity...</option>
                <option value="watering">💧 Watering</option>
                <option value="fertilizer">🌿 Fertilizer</option>
                <option value="pest">🐛 Pest/Disease</option>
                <option value="maintenance">🔧 Maintenance</option>
                <option value="observation">👁️ Observation</option>
            </select>
        </div>

        <!-- Fertilizer Type (Conditional) -->
        <div class="form-group" id="fertilizer-type-group" style="display:none;">
            <label class="form-label" for="fertilizer-type">Fertilizer Type</label>
            <select id="fertilizer-type" class="form-select">
                <option value="">Select...</option>
                <option value="balanced">Balanced (10-10-10)</option>
                <option value="nitrogen">High Nitrogen</option>
                <option value="bloom">Bloom Booster</option>
                <option value="compost">Compost Tea</option>
            </select>
        </div>

        <!-- Notes -->
        <div class="form-group">
            <label class="form-label" for="log-notes">Notes</label>
            <textarea id="log-notes" class="form-textarea" placeholder="Describe what you did or observed..."></textarea>
        </div>
        
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="clearForm()">Clear</button>
            <button type="submit" class="btn btn-primary">Save Entry</button>
        </div>
    </form>
</div>

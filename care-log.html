<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care Log - Garden Journal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Image Compression Library -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="logo"><i class="fas fa-leaf"></i> Garden Journal</div>
      <nav>
        <a href="index.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="plants.html" class="nav-item"><i class="fas fa-seedling"></i> My Plants</a>
        <a href="care-log.html" class="nav-item active"><i class="fas fa-clipboard-check"></i> Care Log</a>
        <a href="timeline.html" class="nav-item"><i class="fas fa-history"></i> Timeline</a>
      </nav>
    </aside>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div id="mobileMenuBtn" class="mobile-menu-toggle"><i class="fas fa-bars"></i></div>
      
      <header class="header">
        <h1>Care Log</h1>
        <p class="header-subtitle">Track watering, fertilizing, and observations</p>
      </header>

      <form id="care-log-form" onsubmit="saveCareLog(event)" class="care-log-form">
        <!-- Plant Selector -->
        <div class="form-group">
          <label class="form-label">Plants / Herbs *</label>
          <div class="plant-selector">
            <div id="select-all-header" class="selector-header" onclick="toggleAllPlants(event)">
              <input type="checkbox" id="select-all-plants">
              <label class="check-label" for="select-all-plants">Select All</label>
            </div>
            <div id="plant-groups"></div>
          </div>
          <p class="text-muted mt-xs" style="font-size: 0.8125rem;">Tap groups to expand. Select individual plants or use group checkboxes.</p>
        </div>

        <!-- Date -->
        <div class="form-group">
          <label class="form-label">Date *</label>
          <input type="date" id="log-date" class="form-input form-input-date" required>
        </div>

        <!-- Activity Dropdown -->
        <div class="form-group">
          <label class="form-label">Activity *</label>
          <select id="log-type" class="form-select" onchange="toggleFields()" required>
            <option value="">Select activity...</option>
            <option value="watering">💧 Watering</option>
            <option value="fertilizer">🌿 Fertilizer</option>
            <option value="pest">🐛 Pest/Disease</option>
            <option value="maintenance">🔧 Maintenance</option>
            <option value="observation">👁️ Observation</option>
          </select>
        </div>

        <!-- Fertilizer Type (Hidden by default) -->
        <div class="form-group hidden" id="fertilizer-type-group">
          <label class="form-label">Fertilizer Type</label>
          <select id="fertilizer-type" class="form-select">
            <option value="">Select...</option>
            <option value="Balanced (10-10-10)">Balanced (10-10-10)</option>
            <option value="High Nitrogen">High Nitrogen</option>
            <option value="Bloom Booster">Bloom Booster</option>
            <option value="Compost Tea">Compost Tea</option>
          </select>
        </div>

        <!-- Notes -->
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea id="log-notes" class="form-textarea" rows="3" placeholder="Add observations or instructions..."></textarea>
        </div>

        <!-- Image Upload -->
        <div class="form-group">
          <label class="form-label">Attach Photo (Optional)</label>
          <div class="image-upload-area">
            <button type="button" id="uploadPicBtn" class="btn btn-secondary">📷 Add Picture</button>
            <input type="file" id="picFileInput" accept="image/*" hidden>
            <div id="uploadStatus" class="upload-status"></div>
            <img id="previewImg" class="preview-img" style="display: none;">
            <button type="button" id="removePicBtn" class="btn-remove-img hidden">✕ Remove</button>
          </div>
        </div>

        <!-- Actions -->
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
          <button type="button" class="btn btn-secondary" onclick="clearForm()">Clear</button>
          <button type="submit" id="saveBtn" class="btn btn-primary">Save Entry</button>
        </div>
      </form>

      <!-- Log History -->
      <div class="card mt-md">
        <div class="card-title"><i class="fas fa-history"></i> Recent Entries</div>
        <div id="log-history">
          <p class="no-activity">No care logs yet.</p>
        </div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
  <div id="log-detail-modal" class="modal" onclick="if(event.target===this) closeLogDetailModal()">
  <div class="modal-content log-detail-modal">
    <div class="modal-header">
      <h2 class="modal-title"><i class="fas fa-clipboard-check"></i> Care Log Details</h2>
      <button class="modal-close" onclick="closeLogDetailModal()">&times;</button>
    </div>
    <div id="log-detail-body" class="log-detail-body"></div>
  </div>
</div>
</body>
</html>

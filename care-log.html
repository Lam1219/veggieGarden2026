<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Log - Garden Journal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-leaf"></i>
                    <span>Garden Journal</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="plants.html" class="nav-item">
                    <i class="fas fa-seedling"></i>
                    <span>My Plants</span>
                </a>
                <a href="care-log.html" class="nav-item active">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Care Log</span>
                </a>
                <a href="timeline.html" class="nav-item">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Timeline</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span>Gardener</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <header class="page-header">
                    <h1>Care Log</h1>
                    <p class="page-subtitle">Track watering, fertilizing, and plant care activities</p>
                </header>

                <!-- Add Log Form -->
                <div class="card">
                    <h3><i class="fas fa-plus-circle"></i> New Care Entry</h3>
                    <form onsubmit="saveCareLog(event)" class="care-log-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="log-plant">Plant *</label>
                                <select id="log-plant" required>
                                    <option value="">Select a plant...</option>
                                    <!-- Will be populated dynamically -->
                                </select>
                                <small class="form-hint">Choose the plant you're logging care for</small>
                            </div>

                            <div class="form-group">
                                <label for="log-date">Date *</label>
                                <input type="date" id="log-date" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="log-type">Activity Type *</label>
                                <select id="log-type" required onchange="toggleFields()">
                                    <option value="">Select activity...</option>
                                    <option value="watering">💧 Watering</option>
                                    <option value="fertilizer">🌿 Fertilizer</option>
                                    <option value="pest">🐛 Pest/Disease Check</option>
                                    <option value="maintenance">🔧 Maintenance</option>
                                    <option value="observation">👁️ Observation</option>
                                </select>
                            </div>

                            <div class="form-group" id="fertilizer-type-group" style="display:none;">
                                <label for="fertilizer-type">Fertilizer Type</label>
                                <select id="fertilizer-type">
                                    <option value="">Select...</option>
                                    <option value="balanced">Balanced (10-10-10)</option>
                                    <option value="nitrogen">High Nitrogen</option>
                                    <option value="bloom">Bloom Booster</option>
                                    <option value="compost">Compost Tea</option>
                                    <option value="organic">Organic Mix</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="log-notes">Notes</label>
                            <textarea id="log-notes" rows="3" placeholder="Describe what you did or observed..."></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-primary">
                                <i class="fas fa-save"></i> Save Log Entry
                            </button>
                            <button type="button" class="btn-secondary" onclick="clearForm()">
                                <i class="fas fa-undo"></i> Clear
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Care Log History -->
                <div class="card">
                    <h3><i class="fas fa-history"></i> Log History</h3>
                    <div id="log-history" class="log-history">
                        <!-- Logs will be loaded here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>

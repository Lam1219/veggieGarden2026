<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Plants - Garden Journal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuBtn" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
    </button>
    
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fas fa-leaf"></i>
                <span>Garden Journal</span>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="plants.html" class="nav-item active">
                    <i class="fas fa-seedling"></i>
                    <span>My Plants</span>
                </a>
                <a href="care-log.html" class="nav-item">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Care Log</span>
                </a>
                <a href="timeline.html" class="nav-item">
                    <i class="fas fa-calendar"></i>
                    <span>Timeline</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h1>My Plants</h1>
                <p class="header-subtitle">Manage your garden inventory & layouts</p>
            </header>

            <!-- ✅ Add Plant Button: Top-right (Fitts's Law + Jakob's Law) -->
            <div class="page-actions">
                <button class="btn btn-primary" onclick="showAddPlantModal()">
                    <i class="fas fa-plus"></i> Add Plant
                </button>
            </div>

            <!-- ✅ Active Plants Section: Filters directly above grid (Law of Proximity) -->
            <div class="card active-plants-section">
                <h2 class="card-title">
                    <i class="fas fa-seedling"></i>
                    Active Plants
                </h2>
                
                <!-- Filters: Grouped in common region, close to content -->
                <div class="filter-group">
                    <button class="filter-btn active" onclick="filterPlants('all')">All</button>
                    <button class="filter-btn" onclick="filterPlants('indoor')">Indoor</button>
                    <button class="filter-btn" onclick="filterPlants('outdoor')">Outdoor</button>
                    <button class="filter-btn" onclick="filterPlants('ready')">✓ Ready</button>
                </div>

                <!-- Plant Grid: Clear visual container (Law of Common Region) -->
                <div class="plants-grid" id="plants-grid">
                    <!-- Populated by JavaScript -->
                </div>
            </div>

            <!-- Other sections remain below -->
            <div class="card">
                <h2 class="card-title"><i class="fas fa-box-open"></i> Seed Inventory</h2>
                <!-- Inventory content -->
            </div>

            <div class="card">
                <h2 class="card-title"><i class="fas fa-th-large"></i> Garden Box Layouts</h2>
                <!-- Layout content -->
            </div>
        </main>
    </div>

    <!-- Add Plant Modal (unchanged) -->
    <div id="add-plant-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Add New Plant</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="add-plant-form">
                <div class="form-group">
                    <label class="form-label" for="plant-name">Name *</label>
                    <input type="text" id="plant-name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="plant-variety">Variety</label>
                    <input type="text" id="plant-variety" class="form-input">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="plant-type">Type *</label>
                        <select id="plant-type" class="form-select" required>
                            <option value="">Select...</option>
                            <option value="tomato">Tomato</option>
                            <option value="cucumber">Cucumber</option>
                            <option value="zucchini">Zucchini</option>
                            <option value="squash">Squash</option>
                            <option value="carrot">Carrot</option>
                            <option value="lettuce">Lettuce</option>
                            <option value="spinach">Spinach</option>
                            <option value="arugula">Arugula</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="plant-date">Planting Date *</label>
                        <input type="date" id="plant-date" class="form-input" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="location">Location *</label>
                    <select id="location" class="form-select" required>
                        <option value="indoor">🏠 Indoors</option>
                        <option value="outdoor">🌱 Outdoors</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="notes">Notes</label>
                    <textarea id="notes" class="form-textarea" placeholder="Care tips, variety notes, etc."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Plant</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
